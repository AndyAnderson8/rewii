name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: rewii-linux-x86_64
          - os: windows-latest
            asset: rewii-windows-x86_64.exe
          - os: macos-14
            asset: rewii-macos-arm64
          - os: macos-13
            asset: rewii-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run pytest -q
      - run: uv run pyinstaller packaging/rewii.spec --noconfirm --distpath dist --workpath build/pyi
      - name: Smoke test
        shell: bash
        run: |
          ls dist
          if [ -f dist/rewii.exe ]; then exe=dist/rewii.exe; else exe=dist/rewii; fi
          "$exe" --version
          mv "$exe" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
