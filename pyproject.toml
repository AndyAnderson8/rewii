[project]
name = "rewii"
version = "0.1.0"
description = "All-in-one toolkit for softmodded Wiis: games, channels, homebrew, saves, backups."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "libwiipy>=0.6.0",
    "platformdirs>=4.14.8",
    "psutil>=7.2.2",
    "pycryptodome>=4.6.0",
    "textual>=8.2.8",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[project.scripts]
rewii = "rewii.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
